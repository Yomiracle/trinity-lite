name: Publish to PyPI

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "pyproject.toml"
      - "trinity_lite/**"
      - "tests/**"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python3 -m pip install -e ".[yaml]" pytest
          python3 -m pytest tests/ -x -q
          python3 -m compileall -q trinity_lite
          python3 -m trinity_lite doctor --scan-root .

      - name: Install build tools
        run: python3 -m pip install --upgrade build twine

      - name: Build package
        run: python3 -m build

      - name: Check package metadata
        run: python3 -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  verify:
    name: Verify distribution artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify downloaded package metadata
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine check dist/*

  publish:
    name: Publish distribution to PyPI
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trinity-lite/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
